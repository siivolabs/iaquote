[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iaquote"
version = "0.3.2"
description = "Catalogue enrichi et devis fondés sur des fiches vérifiées"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "asgiref>=3.7,<4",
  "gunicorn>=22,<24",
]

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: tests requiring an external catalogue endpoint"]
