services:
  iaquote:
    build: .
    image: iaquote:0.3.2
    container_name: iaquote
    restart: unless-stopped
    ports:
      - "8094:8080"
    environment:
      DATABASE_PATH: /data/devisia.sqlite
      CATALOG_SEARCH_BASE_URL: ${CATALOG_SEARCH_BASE_URL:?Define CATALOG_SEARCH_BASE_URL in Dockge}
      CATALOG_MATCH_THRESHOLD: ${CATALOG_MATCH_THRESHOLD:-0.58}
      CATALOG_REQUEST_DELAY: ${CATALOG_REQUEST_DELAY:-1.0}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY in Dockge}
    volumes:
      - iaquote_data:/data

volumes:
  iaquote_data:
    name: iaquote_data
