services:
  iaquote:
    image: ghcr.io/siivolabs/iaquote:latest
    container_name: iaquote
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"
      DATABASE_PATH: /data/devisia.sqlite
      CATALOG_SEARCH_BASE_URL: "${CATALOG_SEARCH_BASE_URL:?CATALOG_SEARCH_BASE_URL must be set}"
      ENRICHMENT_DELAY_SECONDS: "${ENRICHMENT_DELAY_SECONDS:-2.5}"
      HTTP_TIMEOUT: "${HTTP_TIMEOUT:-20}"
    volumes:
      - iaquote_data:/data
volumes:
  iaquote_data:
